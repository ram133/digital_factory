<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll dAPP - Decentralized Voting Portal</title>
  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: #12151e;
      --bg-card: #181c28;
      --border-color: #262d3d;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .wallet-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: opacity 0.2s;
    }

    .wallet-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    .poll-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .poll-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .poll-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
    }

    .option-container {
      margin-bottom: 16px;
      cursor: pointer;
    }

    .option-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .option-box:hover {
      border-color: var(--accent);
    }

    .option-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(59, 130, 246, 0.12);
      z-index: 1;
      transition: width 0.4s ease;
    }

    .option-content {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .option-percentage {
      color: var(--accent);
      font-weight: 700;
    }

    .vote-action-btn {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vote-action-btn:hover {
      border-color: var(--accent);
      background-color: var(--accent-glow);
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      background-color: var(--bg-surface);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">P</div>
      <div>
        <div class="brand-title">Poll dAPP</div>
        <div class="brand-subtitle">Decentralized Voting</div>
      </div>
    </div>
    <button id="connectWalletBtn" class="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
  </header>

  <main class="container">
    <div class="poll-card">
      <div class="poll-header">SIP-12: Implement Automated Liquidity Staking Pools</div>
      <div class="poll-meta">
        <span>Category: Governance</span>
        <span id="pollStatus">Status: Active</span>
      </div>

      <div class="option-container" onclick="castVote(0)">
        <div class="option-box">
          <div class="option-progress" id="progress-0" style="width: 70%;"></div>
          <div class="option-content">
            <span>Yes, execute immediately</span>
            <span class="option-percentage" id="pct-0">70%</span>
          </div>
        </div>
      </div>

      <div class="option-container" onclick="castVote(1)">
        <div class="option-box">
          <div class="option-progress" id="progress-1" style="width: 20%;"></div>
          <div class="option-content">
            <span>No, delay until Q3 review</span>
            <span class="option-percentage" id="pct-1">20%</span>
          </div>
        </div>
      </div>

      <div class="option-container" onclick="castVote(2)">
        <div class="option-box">
          <div class="option-progress" id="progress-2" style="width: 10%;"></div>
          <div class="option-content">
            <span>Abstain</span>
            <span class="option-percentage" id="pct-2">10%</span>
          </div>
        </div>
      </div>

      <button class="vote-action-btn" onclick="castVote(0)">Cast On-Chain Vote</button>
    </div>
  </main>

  <footer>
    Poll dAPP &copy; 2026 - Edge Accelerated Web3 Infrastructure
  </footer>

  <script>
    let userAddress = null;
    let voteCounts = [70, 20, 10];

    async function connectWallet() {
      const btn = document.getElementById('connectWalletBtn');
      if (typeof window.ethereum !== 'undefined') {
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          userAddress = accounts[0];
          btn.innerText = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
        } catch (err) {
          alert('Wallet connection rejected.');
        }
      } else {
        userAddress = '0x71C7...8976F';
        btn.innerText = '0x71C7...8976F (Demo)';
        alert('No Web3 wallet extension found. Activated Demo Mode!');
      }
    }

    function castVote(index) {
      if (!userAddress) {
        alert('Please connect your wallet first!');
        return;
      }
      voteCounts[index] += 1;
      const total = voteCounts.reduce((a, b) => a + b, 0);

      voteCounts.forEach((count, i) => {
        const pct = Math.round((count / total) * 100);
        document.getElementById(`progress-${i}`).style.width = pct + '%';
        document.getElementById(`pct-${i}`).innerText = pct + '%';
      });

      alert('Vote recorded successfully!');
    }
  </script>
</body>
</html>
