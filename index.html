<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll dAPP - Decentralized Voting Portal</title>
  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: #12151e;
      --bg-card: #181c28;
      --border-color: #262d3d;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .wallet-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: opacity 0.2s;
    }

    .wallet-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    .poll-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .poll-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .poll-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
    }

    .option-container {
      margin-bottom: 16px;
      cursor: pointer;
    }

    .option-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .option-box:hover {
      border-color: var(--accent);
    }

    .option-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(59, 130, 246, 0.12);
      z-index: 1;
      transition: width 0.4s ease;
    }

    .option-content {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .option-percentage {
      color: var(--accent);
      font-weight: 700;
    }

    .vote-action-btn {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vote-action-btn:hover {
      border-color: var(--accent);
      background-color: var(--accent-glow);
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      background-color: var(--bg-surface);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">P</div>
      <div>
        <div class="brand-title">Poll dAPP</div>
        <div class="brand-subtitle">Serverless Cloudflare Worker Node</div>
      </div>
    </div>
    <button class="wallet-btn" id="walletBtn" onclick="toggleWallet()">Connect Wallet</button>
  </header>

  <div class="container">
    <div class="poll-card">
      <div class="poll-header" id="pollQuestion">Loading live question from edge...</div>
      <div class="poll-meta">
        <span id="pollIdText">Smart Contract ID: #0489-cf</span>
        <span id="totalVotesText">Total Votes: --</span>
      </div>

      <div id="optionsList">
        <!-- Options injected dynamically -->
      </div>

      <button class="vote-action-btn" onclick="submitVote()">Submit Verified Vote</button>
    </div>
  </div>

  <footer>
    Poll dAPP &bull; Secured via Cloudflare Workers & KV Storage
  </footer>

  <script>
    const WORKER_API = "https://wild-resonance-ff4a.3659745.workers.dev/api/poll/1";
    const WORKER_VOTE_API = "https://wild-resonance-ff4a.3659745.workers.dev/api/vote";

    let selectedOption = null;
    let hasVoted = false;
    let pollData = { options: [], totalVotes: 0 };

    async function fetchPollData() {
      try {
        const response = await fetch(WORKER_API);
        const data = await response.json();
        pollData = data;
        document.getElementById('pollQuestion').innerText = pollData.question;
        document.getElementById('pollIdText').innerText = `Smart Contract ID: #${pollData.id}`;
        renderPoll();
      } catch (err) {
        console.error("Failed to fetch from worker:", err);
      }
    }

    function renderPoll() {
      const total = pollData.options.reduce((sum, opt) => sum + opt.votes, 0);
      document.getElementById('totalVotesText').innerText = `Total Votes: ${total}`;
      
      let html = '';
      pollData.options.forEach((opt, idx) => {
        const pct = total > 0 ? Math.round((opt.votes / total) * 100) : 0;
        const isSelected = selectedOption === idx;
        const borderColor = isSelected ? 'var(--accent)' : 'var(--border-color)';
        
        html += `
          <div class="option-container" onclick="selectOption(${idx})">
            <div class="option-box" style="border-color: ${borderColor}">
              <div class="option-progress" style="width: ${pct}%"></div>
              <div class="option-content">
                <span>${opt.text} ${isSelected ? '✓' : ''}</span>
                <span class="option-percentage">${pct}% (${opt.votes})</span>
              </div>
            </div>
          </div>
        `;
      });
      document.getElementById('optionsList').innerHTML = html;
    }

    function selectOption(idx) {
      if (hasVoted) return;
      selectedOption = idx;
      renderPoll();
    }

    function toggleWallet() {
      const btn = document.getElementById('walletBtn');
      if (btn.innerText === 'Connect Wallet') {
        btn.innerText = '0x498...B289';
        btn.style.backgroundColor = '#10b981';
      } else {
        btn.innerText = 'Connect Wallet';
        btn.style.backgroundColor = 'var(--accent)';
      }
    }

    async function submitVote() {
      if (selectedOption === null) {
        alert('Please select an option before submitting your vote.');
        return;
      }
      if (hasVoted) {
        alert('You have already cast your vote from this session.');
        return;
      }

      try {
        const res = await fetch(WORKER_VOTE_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pollId: '1', optionIndex: selectedOption })
        });
        const result = await res.json();
        if (result.success) {
          pollData.options[selectedOption].votes += 1;
          hasVoted = true;
          renderPoll();
          alert('Vote successfully recorded to Cloudflare Worker edge node!');
        }
      } catch (err) {
        console.error("Vote submission error:", err);
        alert('Error recording vote.');
      }
    }

    fetchPollData();
  </script>
</body>
</html>
