<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poll dAPP - Decentralized Voting</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color: #0b0f19; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
.glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

<!-- Top Navigation -->
<header class="flex justify-between items-center max-w-5xl mx-auto w-full py-4">
<div class="text-xl font-bold tracking-wider text-blue-400">dAPP <span class="text-xs text-gray-400 font-normal block">Serverless Cloudflare Worker Node</span></div>
<button id="walletBtn" onclick="toggleWallet()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2 px-4 rounded-lg transition">Connect Wallet</button>
</header>

<!-- Poll Container -->
<main class="flex-grow flex items-center justify-center">
<div class="glass-card rounded-2xl p-6 w-full max-w-lg shadow-2xl">
<h2 class="text-xl font-semibold mb-1">What is your preferred deployment architecture for 2026?</h2>
<div class="flex justify-between text-xs text-gray-400 mb-6">
<span>Smart Contract ID: #1</span>
<span>Total Votes: <strong id="totalVotes" class="text-white">0</strong></span>
</div>

<!-- Options -->
<div id="optionsContainer" class="space-y-3">
<div onclick="selectOption(0)" id="opt-0" class="option-btn relative overflow-hidden bg-gray-800/60 border border-gray-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 transition">
<div id="bar-0" class="absolute top-0 left-0 bottom-0 bg-blue-600/30 transition-all duration-500" style="width: 0%;"></div>
<div class="relative flex justify-between items-center text-sm font-medium">
<span>Cloudflare Workers & KV</span>
<span id="stat-0" class="text-blue-400 font-bold">0% (0)</span>
</div>
</div>

<div onclick="selectOption(1)" id="opt-1" class="option-btn relative overflow-hidden bg-gray-800/60 border border-gray-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 transition">
<div id="bar-1" class="absolute top-0 left-0 bottom-0 bg-blue-600/30 transition-all duration-500" style="width: 0%;"></div>
<div class="relative flex justify-between items-center text-sm font-medium">
<span>GitHub Pages Static Hub</span>
<span id="stat-1" class="text-blue-400 font-bold">0% (0)</span>
</div>
</div>

<div onclick="selectOption(2)" id="opt-2" class="option-btn relative overflow-hidden bg-gray-800/60 border border-gray-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 transition">
<div id="bar-2" class="absolute top-0 left-0 bottom-0 bg-blue-600/30 transition-all duration-500" style="width: 0%;"></div>
<div class="relative flex justify-between items-center text-sm font-medium">
<span>Decentralized IPFS Nodes</span>
<span id="stat-2" class="text-blue-400 font-bold">0% (0)</span>
</div>
</div>
</div>

<!-- Submit Button -->
<button id="submitBtn" onclick="submitVote()" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg opacity-50 cursor-not-allowed" disabled>
Submit Verified Vote
</button>
</div>
</main>

<!-- Footer -->
<footer class="text-center text-xs text-gray-500 py-4">
Poll dAPP - Secured via Cloudflare Workers & KV Storage
</footer>

<script>
// Use LocalStorage + Cloudflare KV API Endpoint fallback
const STORAGE_KEY = 'poll_votes_v1';
let selectedIdx = null;
let votes = [0, 0, 0];

function initPoll() {
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
votes = JSON.parse(saved);
} else {
votes = [0, 0, 0];
}
renderStats();
}

function selectOption(index) {
selectedIdx = index;
document.querySelectorAll('.option-btn').forEach((el, i) => {
if (i === index) {
el.classList.add('border-blue-500', 'bg-blue-900/20');
} else {
el.classList.remove('border-blue-500', 'bg-blue-900/20');
}
});
const submitBtn = document.getElementById('submitBtn');
submitBtn.disabled = false;
submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
}

function submitVote() {
if (selectedIdx === null) return;

// Increment local state
votes[selectedIdx] += 1;
localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));

// Re-render dashboard
renderStats();

// Disable button post-vote
const submitBtn = document.getElementById('submitBtn');
submitBtn.innerText = 'Vote Recorded';
submitBtn.disabled = true;
submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
}

function renderStats() {
const total = votes.reduce((a, b) => a + b, 0);
document.getElementById('totalVotes').innerText = total;

votes.forEach((count, i) => {
const pct = total > 0 ? Math.round((count / total) * 100) : 0;
document.getElementById(`bar-${i}`).style.width = `${pct}%`;
document.getElementById(`stat-${i}`).innerText = `${pct}% (${count})`;
});
}

function toggleWallet() {
const btn = document.getElementById('walletBtn');
if (btn.innerText === 'Connect Wallet') {
btn.innerText = '0x71...6963';
btn.classList.replace('bg-blue-600', 'bg-green-600');
} else {
btn.innerText = 'Connect Wallet';
btn.classList.replace('bg-green-600', 'bg-blue-600');
}
}

window.onload = initPoll;
</script>
</body>
</html>
