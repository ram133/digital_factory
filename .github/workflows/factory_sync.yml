name: Digital Factory Cloud Sync

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:

jobs:
  build-cloud-factory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Cloud Factory Generator
        run: |
          python3 -c '
          import os, json, datetime
          os.makedirs("renders", exist_ok=True)
          timestamp = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          brief = f"# Cloud Automated Brief\n\nGenerated by GitHub Actions at {timestamp}\n"
          with open("SOCIAL_BRIEF.md", "w") as f:
              f.write(brief)
          print("Cloud factory sync cycle executed successfully.")
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SOCIAL_BRIEF.md repo_inventory.json index.html README.md || true
          git commit -m "Cloud Factory automated sync update [skip ci]" || echo "No changes to commit"
          git push
