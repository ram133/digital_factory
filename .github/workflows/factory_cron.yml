name: Digital Factory Autonomous Engine

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests google-genai moviepy beautifulsoup4 streamlit

      - name: Execute Autonomous Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 product_innovator.py
          python3 scraper.py
          python3 marketing_agent.py

      - name: Commit and Push Assets & Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html daily_report.json campaign_outreach.json scraped_leads.json products/
          git commit -m "Automated daily execution: dynamic products, lead scraper & outreach [skip ci]" || echo "No changes"
          git push
