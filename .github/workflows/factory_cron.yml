name: Digital Factory Daily Cloud Runner

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests google-genai moviepy beautifulsoup4 streamlit

      - name: Build Daily Deliverable Products & Links
        run: |
          python3 pipeline_upgrade.py
          python3 marketing_agent.py

      - name: Commit and Push Daily Deliverables
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_report.json campaign_outreach.json products/
          git commit -m "Automated production: generated 3 monetized products & catalog [skip ci]" || echo "No changes"
          git push
